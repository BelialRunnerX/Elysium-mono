modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-colonies/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine, and the only Elysium module this one needs.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# MineColonies, and required rather than optional. Every other module in this
# repository is Elysium's own replacement for something; this one is an add-on
# to a mod that already exists, and an add-on whose host is absent is a jar
# that loads and does nothing. Saying so here means the loader explains that
# rather than the player finding out by not noticing anything.
[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Deliberately no dependency on Apotheosis, Apothic Spawners or Silent Gear,
# and none on elysium-core either: this module needs the engine and the host,
# and its validator enforces that.
