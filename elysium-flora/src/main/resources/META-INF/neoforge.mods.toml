modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-flora/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
# One emblem for the whole pack, generated from the interface palette by
# tools/gen_emblem.py into the library jar; pixel art, so it is not blurred.
logoFile="elysium_logo.png"
logoBlur=false
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. A field pays out by the grower's world tier and that is the only
# reason the library is here; there is no dependency on any content module.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Emberwood grows on Cinderveil as well as in the Nether. Optional, because a
# biome modifier naming a biome that is not there is simply a modifier that
# matches nothing, and the Nether is always there.
[[dependencies.${mod_id}]]
    modId="elysiumspace"
    type="optional"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
