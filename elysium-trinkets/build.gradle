plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 with 1.21.1, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    // Pick up anything produced by `gradlew runData`.
    srcDir 'src/generated/resources'

    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
    exclude '.gitkeep'
}

repositories {
    // NeoGradle contributes the NeoForged maven itself.

    // Curios lives on Illusive Soulworks' maven. Nothing else is fetched from
    // here, and the mod is a compile dependency rather than a bundled one -
    // players install Curios themselves, exactly as the mods.toml says.
    maven {
        name = 'IllusiveSoulworks'
        url = 'https://maven.theillusivec4.top/'
    }

    // Where the library jar comes from. Three options, in the order to try
    // them; each is independent, so delete the ones you do not use.
    //
    // 1. A sibling checkout that has been `gradlew publish`ed. This is the
    //    default because it needs no network and no credentials, and because
    //    the two repos are usually checked out next to each other.
    maven {
        name = 'elysiumLibLocal'
        url = uri("${rootDir}/../elysium-lib/repo")
    }

    // 2. Whatever `gradlew publishToMavenLocal` put in ~/.m2, for when the
    //    checkouts are not side by side.
    mavenLocal()

    // 3. GitHub Packages, for CI and for anyone who is not building the
    //    library themselves. Needs GITHUB_ACTOR / GITHUB_TOKEN.
    // maven {
    //     name = 'GitHubPackages'
    //     url = 'https://maven.pkg.github.com/BelialRunnerX/elysium-lib'
    //     credentials {
    //         username = System.getenv('GITHUB_ACTOR')
    //         password = System.getenv('GITHUB_TOKEN')
    //     }
    // }
}

// Default run configurations.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // The library. `implementation` rather than `compileOnly`: this mod cannot
    // run without it, and the mods.toml declares it as a required dependency
    // so the loader says so plainly instead of throwing NoClassDefFoundError
    // at a player.
    //
    // It is NOT bundled into this jar. Two Elysium mods each shipping their
    // own copy of the library is exactly the failure this split exists to
    // avoid — players install elysiumlib once.
    implementation "com.elysium:elysiumlib:${elysiumlib_version}"

    // The library jar has to be on the *runtime* classpath of runClient and
    // runServer too, or the dev environment loads core against nothing.
    localRuntime "com.elysium:elysiumlib:${elysiumlib_version}"

    // Curios. compileOnly plus localRuntime rather than implementation: the
    // API is needed to compile the one adapter class and needed at runtime in
    // the dev environment, and must NOT be bundled into this jar - two mods
    // shipping copies of an accessory API is how slots end up registered twice.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // Apotheosis / Silent Gear / Legendary Tooltips are soft dependencies.
    // Elysium never references their classes, so they are deliberately NOT
    // declared here - adding them as compile dependencies is what made the old
    // affix classes unbuildable. If you later want to call their APIs directly,
    // add them as `compileOnly` and keep the calling code in a class that is
    // only loaded behind a ModList.get().isLoaded(...) check.
}

// Expands ${mod_id}, ${mod_version} and friends inside neoforge.mods.toml.
// Without this the placeholders ship literally and the mod fails to load.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }

    // Hand-written resources win over anything datagen produces, so running
    // `runData` never breaks a subsequent `build`.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
