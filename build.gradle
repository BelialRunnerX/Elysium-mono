// ---------------------------------------------------------------------------
// The root build: coordination only
// ---------------------------------------------------------------------------
//
// This project has no sources, no plugins and no NeoGradle. All it does is
// give the included builds a single entry point, so that one push to one
// repository builds every mod.
//
// Every task here is a fan-out to the included builds. None of them changes how
// an individual mod is built — that still lives in its own build.gradle, which
// is why each directory remains buildable on its own.

// The library is listed first for readability only. The build *order* is not
// decided here and must not be: Gradle derives it from the dependency
// substitution in settings.gradle, which is the single place that knows which
// content mods need the library's classes. Pinning an order here as well would
// be a second, silently divergent answer to the same question — and it would
// be wrong today, because elysium-solarpunk is a content mod that depends on
// nothing but NeoForge and can build before the library or after it.
def MODS = ['elysium-lib', 'elysium-core', 'elysium-dungeons', 'elysium-mobs',
            'elysium-trinkets', 'elysium-npcs', 'elysium-solarpunk',
            'elysium-armory', 'elysium-ascendancy', 'elysium-space']

// Every count in this file comes from here rather than being typed out. The
// descriptions used to say "all six", which stopped being true the moment a
// seventh module was added and was wrong in six places at once — and a task
// description that lies is read by everybody running `./gradlew tasks`.
def modCount = MODS.size()

tasks.register('buildAll') {
    group = 'elysium'
    description = "Builds all ${modCount} mods. The jars land in each mod's build/libs."
    dependsOn MODS.collect { gradle.includedBuild(it).task(':build') }
}

/**
 * `build` at the root, because that is what everybody types.
 *
 * When these were four repositories, `./gradlew build` at a repo root was the
 * command — it is what the per-repo CI ran, what the README said, and what
 * muscle memory reaches for. Folding them into a composite build silently took
 * it away: a composite root gets no lifecycle tasks of its own, so `./gradlew
 * build` here stopped meaning "build the mods" and started meaning "Task
 * 'build' not found in root project 'elysium'".
 *
 * That is a migration leaving a trap behind rather than a design decision.
 * Anything still running the old command — an old workflow, a script, a person
 * — deserves to get what it asked for instead of an error about a task name.
 */
tasks.register('build') {
    group = 'elysium'
    description = 'Alias for buildAll, so the pre-monorepo command still works.'
    dependsOn 'buildAll'
}

tasks.register('cleanAll') {
    group = 'elysium'
    description = "Cleans all ${modCount} builds."
    dependsOn MODS.collect { gradle.includedBuild(it).task(':clean') }
}

tasks.register('clean') {
    group = 'elysium'
    description = 'Alias for cleanAll — see `build` above.'
    dependsOn 'cleanAll'
}

tasks.register('publishAll') {
    group = 'elysium'
    description = "Publishes all ${modCount} to ~/.m2, for consumers outside this repo."
    dependsOn MODS.collect { gradle.includedBuild(it).task(':publishToMavenLocal') }
}

/**
 * Every jar, gathered into one directory.
 *
 * Without this, "where are my mods" is one build/libs directory per module,
 * and the answer to "which files do I drop in my mods folder" is a scavenger
 * hunt across the repo. This is also what CI uploads, so the workflow artifact
 * is exactly the set of files a player installs.
 *
 * Sources jars are excluded on purpose: dropping one into a mods folder is a
 * well-known way to get a confusing crash, and there is no reason for one to be
 * sitting next to the real jars in a directory named "dist".
 */
// Everything the task's action needs is captured here, at configuration time,
// as a plain File and a plain int. A closure that reaches back for `MODS`,
// `layout` or `fileTree` when it runs is holding a reference to the build
// script itself, which the configuration cache refuses — "Cannot reference a
// Gradle script object from a Groovy closure". Found by running it.
def distDir = layout.projectDirectory.dir('dist').asFile
def expectedJars = modCount

tasks.register('collectJars', Copy) {
    group = 'elysium'
    description = 'Copies every mod jar into dist/.'
    dependsOn 'buildAll'

    MODS.each { mod ->
        from(layout.projectDirectory.dir("$mod/build/libs")) {
            include '*.jar'
            exclude '*-sources.jar'
            exclude '*-javadoc.jar'
        }
    }
    into distDir

    doLast {
        // The merged jar also lives in dist/ and is not one of the jars this
        // task produces, so it is excluded from the count. Without this the
        // second run of collectJars after a mergeJar finds one jar too many
        // and fails with a message about a mod that did not build.
        def jars = (distDir.listFiles() ?: new File[0])
                .findAll { it.name.endsWith('.jar') && !it.name.startsWith('elysium-all') }
                .sort { it.name }
        logger.lifecycle("\ncollected ${jars.size()} jar(s) into dist/:")
        jars.each { logger.lifecycle("  ${it.name}") }
        if (jars.size() != expectedJars) {
            throw new GradleException(
                    "expected ${expectedJars} jars in dist/, found ${jars.size()} — " +
                    "one of the mods did not produce one")
        }
    }
}

/**
 * Every mod in one installable jar.
 *
 * NeoForge reads every `[[mods]]` block in META-INF/neoforge.mods.toml and
 * finds each mod's @Mod class by scanning the jar, so one file can carry every
 * one of them. The mod ids are deliberately unchanged: renaming them would
 * rename every registry entry, attachment, lang key, texture path, recipe and
 * loot table with them, and every existing world would lose its Elysium items,
 * blocks, standing and claims. A jar is what a player installs; a mod id is
 * not.
 *
 * This takes the real jars from dist/ as input rather than reaching into each
 * module's build directory, so what is merged is exactly what would have
 * shipped.
 *
 * The merge is not concatenation. Many jars are many resource packs and the
 * game merges data packs across them; one jar is one pack, and a path holds one
 * file. tools/mergejar.py unions additive tag files — today
 * data/minecraft/tags/block/mineable/pickaxe.json, written by core, dungeons
 * and solarpunk — and fails on any other collision rather than letting a last
 * writer win. The failure being avoided is not a crash: it is Elysium blocks
 * quietly no longer dropping anything when mined.
 */
def libProperties = new Properties()
file('elysium-lib/gradle.properties').withInputStream { libProperties.load(it) }
def mergedJar = layout.projectDirectory
        .file("dist/elysium-all-${libProperties.getProperty('mod_version')}.jar").asFile
def mergeTool = layout.projectDirectory.file('tools/mergejar.py').asFile
def checkTool = layout.projectDirectory.file('tools/checkjar.py').asFile

tasks.register('mergeJar', Exec) {
    group = 'elysium'
    description = "Merges the ${modCount} mod jars in dist/ into one installable jar."
    dependsOn 'collectJars'

    // Captured as plain values at configuration time. A closure that reaches
    // back for `layout` or `file` when it runs holds a reference to the build
    // script, which the configuration cache refuses — the same trap
    // collectJars documents above.
    def dist = distDir
    def output = mergedJar
    def tool = mergeTool

    workingDir projectDir
    commandLine 'sh', '-c',
            "python3 '${tool}' '${output}' " +
            "\$(ls '${dist}'/*.jar | grep -v elysium-all)"

    doLast {
        if (!output.exists()) {
            throw new GradleException("mergeJar produced no ${output.name}")
        }
        logger.lifecycle("\nmerged jar: dist/${output.name} " +
                "(${(output.length() / 1024) as int} KiB)")
    }
}

/**
 * Proof that the merged jar is installable rather than merely present.
 *
 * Everything it checks is something that produces a jar which builds fine and
 * then misbehaves in game: a `[[mods]]` block whose @Mod class is not in the
 * archive, a namespace that lost its assets, a tag that lost half its entries.
 * None of those fails a build, which is exactly why they need a check of their
 * own.
 */
tasks.register('checkMergedJar', Exec) {
    group = 'elysium'
    description = "Verifies the merged jar declares and contains all ${modCount} mods."
    dependsOn 'mergeJar'

    def dist = distDir
    def output = mergedJar
    def tool = checkTool

    workingDir projectDir
    commandLine 'sh', '-c',
            "python3 '${tool}' '${output}' " +
            "\$(ls '${dist}'/*.jar | grep -v elysium-all)"
}

/**
 * The Python validators, run the way CI runs them.
 *
 * They are seconds of work and they fail on things a Gradle build never looks
 * at: a library class referring to a mod built on it, an item with no recipe, a
 * missing lang key, a hand-edited generated palette. Worth running before the
 * twenty-minute part.
 */
tasks.register('validateAll', Exec) {
    group = 'elysium'
    description = 'Runs every mod\'s validate.py.'
    commandLine 'python3', 'validate.py'
    workingDir projectDir
}

tasks.register('checkAll') {
    group = 'elysium'
    description = 'validateAll, buildAll, collectJars, mergeJar, checkMergedJar — what CI does.'
    dependsOn 'validateAll', 'checkMergedJar'
}

// Ordering, so a validator failure is what you read rather than the last of a
// hundred lines of Gradle output.
tasks.named('collectJars') { mustRunAfter 'validateAll' }
