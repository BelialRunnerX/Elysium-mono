# Settings for this module alone, so it stays independently buildable.

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)

mod_id=elysiumsolarpunk
mod_name=Elysium Solarpunk
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.elysium
mod_authors=BelialRunnerX
mod_description=Elysium Solarpunk: a building set for the other future - white marble, limestone and alabaster worked with copper, gold, iron and brass; copper and greenery, woven cane, bloom glass and rammed earth; plus a line of machines, two of which now do - a solar condenser and an algae bioreactor that between them turn sunlight and water into furnace fuel. Most of it is craftable from what a player already has, and the three white stones are found in the ground. It depends on nothing else in Elysium and can be installed on its own.
