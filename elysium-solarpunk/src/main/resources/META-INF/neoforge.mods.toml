modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/Elysium-mono/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
# One emblem for the whole pack, generated from the interface palette by
# tools/gen_emblem.py into the library jar; pixel art, so it is not blurred.
logoFile="elysium_logo.png"
logoBlur=false
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

# The library, for the runs: the power conduit is a run in the pack's shared
# sense (RunRules), and the shared helper is what makes a conduit behave like
# a wire behaves like a bus. Solarpunk stood alone before this; one shared
# visual language for every pipe in the pack is worth the dependency.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Deliberately no dependency on elysiumlib.
#
# Every other content mod here needs the library, because every one of them
# registers into it - races, runes, rewards, a bestiary. This one is blocks. It
# has no standing, no stats and no factions, so a dependency would be a
# requirement that buys the player nothing and stops the set being installable
# on its own. If the machines later grow behaviour that wants the library, this
# is the line that changes.
