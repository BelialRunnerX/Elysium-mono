# Settings for the root build only. Each of the four included builds keeps its
# own gradle.properties — that is what makes them independently buildable — so
# the mod ids, versions and NeoForge version all live there, not here.

# 3G rather than the 2G each mod uses alone. A composite build can have more
# than one NeoGradle decompile in flight, and running out of heap partway
# through a twenty-minute first build is an expensive way to find out.
org.gradle.jvmargs=-Xmx3G

org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
