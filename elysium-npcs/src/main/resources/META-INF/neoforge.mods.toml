modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-npcs/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. Faction standing, level scaling and the bestiary all live there,
# so this mod does not run without it.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional, and listed only for load order. The court hands out whatever any
# mod has registered as a standing reward, so with elysium-core installed the
# envoys pay in its runes and catalysts and with it absent they pay in whatever
# else is on offer. Neither mod names the other.
[[dependencies.${mod_id}]]
    modId="elysium"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
