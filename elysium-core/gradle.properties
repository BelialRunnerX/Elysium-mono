# Gradle daemon settings.
# 2G rather than the MDK default 1G: decompiling and remapping Minecraft is
# memory hungry and 1G intermittently runs out on a cold cache.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings. Uncomment both lines for named method parameters in the
# Minecraft sources; NeoGradle downloads them from ParchmentMC itself.
# The project previously shipped a parchment zip under libs/ with a flatDir
# repository pointed at it, which is not how NeoGradle consumes Parchment - the
# zip was dead weight and the flatDir repo did nothing.
#neogradle.subsystems.parchment.minecraftVersion=1.21.1
#neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
# The loader range can only use the major version of FML as bounds.
# The old mods.toml declared "[52,)", which is not an FML version at all and
# would have refused to load on every build of NeoForge for 1.21.1.
loader_version_range=[1,)

## Mod properties

mod_id=elysium
mod_name=Elysium
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.elysium
mod_authors=BelialRunnerX
mod_description=Elysium: a character and gear progression mod. Twelve stats, six races and nine classes chosen on first join; tiered elemental armour, weapons and area tools; socketable runes with material alignment; reforging and ascension that scale without a ceiling; and two opposed faction standings that drive spawning and loot. Optional hooks for Apotheosis, Silent Gear and Legendary Tooltips.

## The library this mod is built against.
#
# Kept separate from mod_version because the two version independently: a core
# release that only changes recipes does not need a new library, and a library
# release that only adds an extension point does not need a new core.
elysiumlib_version=1.0.0
