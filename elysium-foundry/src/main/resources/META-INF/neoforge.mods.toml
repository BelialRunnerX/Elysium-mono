modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-foundry/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. The world tier gates which age a player has reached, and that is
# the only reason the library is here; no content module is named.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age I. Age IV adds no new physics at all: it assumes rotation, electricity
# and storage, and adds the full material chain that all three are priced in.
[[dependencies.${mod_id}]]
    modId="elysiumkinetics"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age II. The grid, the wire tiers and the alternator are Age II's, and this
# age stores what that grid does not spend rather than declaring a grid of its
# own — one model of electricity in the pack, not two that disagree.
[[dependencies.${mod_id}]]
    modId="elysiumindustry"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age III. The ore ladder ends at Age III's tripling, and this age is built on
# top of that number rather than extending it — the ladder is 1, 2, 3 and the
# fourth age is about what you make out of the metal, not how much of it there is.
[[dependencies.${mod_id}]]
    modId="elysiumatomics"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# The Cordon's metals: their ingots are elysium-ores', and the chain's alloy
# and refining recipes name them (docs/SPEC_FOUNDRY.md §4).
[[dependencies.${mod_id}]]
    modId="elysiumores"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
