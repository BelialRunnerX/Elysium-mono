# Elysium Library access transformer.
#
# "Uncap everything" (the owner's ruling): vanilla attribute maxima — health 1024,
# armour 30, toughness 20 — are written by ElysiumAttributeLimits.raise, which
# needs the field writable. Read and written by reflection, so nothing fails to
# compile if this is absent; it only lifts the ceilings at runtime.
public-f net.minecraft.world.entity.ai.attributes.RangedAttribute maxValue
