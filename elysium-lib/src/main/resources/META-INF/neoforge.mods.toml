modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-lib/issues"

# Makes RangedAttribute.maxValue writable, so vanilla's attribute ceilings can
# be lifted. See META-INF/accesstransformer.cfg.
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
# One emblem for the whole pack, generated from the interface palette by
# tools/gen_emblem.py into the library jar; pixel art, so it is not blurred.
logoFile="elysium_logo.png"
logoBlur=false
description='''
${mod_description}
'''

# The library depends on NeoForge and nothing else. It deliberately declares no
# optional integrations either: an integration is a thing a content mod does,
# and a library that reached for Apotheosis on its own would be making that
# decision for every mod built on it.
# JEI is optional: compat/jei holds the one class that names it, JEI loads that
# class itself through its annotation scan, and nothing else imports it. Dylan,
# 28 Sep 2026: "support JEI though but leave it as a non dependency" (POLISH.md P6).
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
