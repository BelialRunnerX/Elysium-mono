modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-transit/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. The world tier gates which age a player has reached, and that is
# the only reason the library is here; no content module is named.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age II. A waystone is a machine on that grid like any other: it draws power,
# it fills at the share the grid can afford, and an unpowered one still works —
# slowly. There is one model of electricity in the pack and this is not a
# second one.
[[dependencies.${mod_id}]]
    modId="elysiumindustry"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
