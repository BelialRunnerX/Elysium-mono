modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-dungeons/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. Loot rooms pay out through the library's reward providers, the
# boss moves faction standing, and rooms are a library-style registry, so this
# mod does not run without it.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# elysium-core is NOT required. It supplies reward items when present, and
# without it the library's reward system simply has fewer providers to ask -
# the dungeon still generates and still pays out whatever else is registered.
[[dependencies.${mod_id}]]
    modId="elysium"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
