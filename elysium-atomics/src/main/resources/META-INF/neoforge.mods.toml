modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/BelialRunnerX/elysium-atomics/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The engine. The world tier gates which age a player has reached, and that is
# the only reason the library is here; no content module is named.
[[dependencies.${mod_id}]]
    modId="elysiumlib"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age I. The ages depend downwards only: Age III knows about rotation, and
# elysium-kinetics knows nothing about fission.
[[dependencies.${mod_id}]]
    modId="elysiumkinetics"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Age II. The grid, the wire tiers and the alternator are Age II's, and this
# age stores what that grid does not spend rather than declaring a grid of its
# own — one model of electricity in the pack, not two that disagree.
[[dependencies.${mod_id}]]
    modId="elysiumindustry"
    type="required"
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"
